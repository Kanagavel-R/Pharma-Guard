version: '3.8'

services:
  mysqldb:
    image: mysql:8.0
    container_name: pharmaguard-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:rootpassword}
      MYSQL_DATABASE: pharmaguard
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  app:
    build: .
    container_name: pharmaguard-app
    restart: always
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:mysql://mysqldb:3306/pharmaguard?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USERNAME: root
      DB_PASSWORD: ${DB_PASSWORD:rootpassword}
      GEMINI_API_KEY: ${GEMINI_API_KEY:}
    depends_on:
      mysqldb:
        condition: service_healthy

volumes:
  mysql_data:

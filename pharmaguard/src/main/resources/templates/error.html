<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pharma Guard — Error</title>
    <link rel="stylesheet" href="/css/pharmaguard-theme.css">
</head>

<body style="align-items:center; justify-content:center;">

<div style="width:100%; max-width:520px; padding:20px;">
    <div class="card" style="text-align:center; padding:40px 32px;">
        <div style="font-size:56px; margin-bottom:16px; color:var(--danger);"><i class="fa-solid fa-triangle-exclamation"></i></div>
        <h1 style="font-size:24px; font-weight:800; color:var(--danger); margin-bottom:10px;">Something Went Wrong</h1>
        <p style="color:var(--text-secondary); font-size:14px; margin-bottom:28px; line-height:1.5;">
            We couldn't complete the requested operation. Please verify the request or try again.
        </p>
        <a href="/dashboard" class="btn btn-primary">← Back to Dashboard</a>
    </div>
</div>

<script src="/js/pharmaguard-theme.js"></script>
</body>
</html>

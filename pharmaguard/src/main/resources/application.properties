spring.application.name=pharmaguard

# H2 Database configuration (Embedded file DB with MySQL compatibility mode)
spring.datasource.url=jdbc:h2:file:./data/pharmaguard;AUTO_SERVER=TRUE;MODE=MySQL;DB_CLOSE_DELAY=-1;CASE_INSENSITIVE_IDENTIFIERS=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# MySQL Database configuration (Uncomment to use local MySQL server)
# spring.datasource.url=jdbc:mysql://localhost:3306/pharmaguard?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
# spring.datasource.username=root
# spring.datasource.password=YOUR_MYSQL_PASSWORD
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

server.port=8080

# MongoDB Configuration (Local MongoDB / MongoDB Atlas)
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/pharma_guard}
spring.data.mongodb.auto-index-creation=true

# HikariCP Connection Pool Configuration
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000

# Servlet Multipart File Upload Limits (5MB max file size)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

# ============================================================
# GOOGLE GEMINI AI CONFIGURATION
# ============================================================
gemini.api.key=${GEMINI_API_KEY:}
gemini.model=${GEMINI_MODEL:gemini-3.6-flash}
gemini.api.url=${GEMINI_API_URL:https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent}
